<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 196" width="760" height="169" role="img" aria-labelledby="ignatius-light-title ignatius-light-desc">
  <title id="ignatius-light-title">Ignatius, a quiet instrument for PostgreSQL (light)</title>
  <desc id="ignatius-light-desc">Ignatius studio wordmark on archival paper: a quiet instrument for PostgreSQL. Local-first engine, adaptive palettes, 56 chorded actions, safe transactions. PostgreSQL 14 to 18, no telemetry.</desc>
  <defs>
    <linearGradient id="card-bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F5EC" />
      <stop offset="55%" stop-color="#F2ECE0" />
      <stop offset="100%" stop-color="#EAE1D0" />
    </linearGradient>
    <radialGradient id="sienna-glow-light" cx="12%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#9A3115" stop-opacity="0.09" />
      <stop offset="60%" stop-color="#714304" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#F2ECE0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="slate-glow-light" cx="90%" cy="22%" r="40%">
      <stop offset="0%" stop-color="#25486B" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#F2ECE0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="seal-fill-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EBE3D4" />
    </linearGradient>
    <linearGradient id="border-rim-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8BEAD" />
      <stop offset="50%" stop-color="#B8AE9E" />
      <stop offset="100%" stop-color="#C5BBA9" />
    </linearGradient>
    <linearGradient id="accent-rule-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A3115" />
      <stop offset="55%" stop-color="#25486B" />
      <stop offset="100%" stop-color="#B8AE9E" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Archival rag-paper gallery plaque -->
  <rect x="4" y="4" width="872" height="188" rx="18" fill="url(#card-bg-light)" />
  <rect x="4" y="4" width="872" height="188" rx="18" fill="url(#sienna-glow-light)" />
  <rect x="4" y="4" width="872" height="188" rx="18" fill="url(#slate-glow-light)" />
  <rect x="4.5" y="4.5" width="871" height="187" rx="17.5" fill="none" stroke="url(#border-rim-light)" stroke-width="1" />
  <line x1="28" y1="5.5" x2="852" y2="5.5" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="1" />

  <!-- Architectural crop marks -->
  <path d="M 24 20 H 33 M 24 20 V 29" fill="none" stroke="#9B9080" stroke-width="1" stroke-linecap="round" />
  <path d="M 856 176 H 847 M 856 176 V 167" fill="none" stroke="#9B9080" stroke-width="1" stroke-linecap="round" />

  <!-- Balanced Geometric Seal: Architectural Portal + PG Database Strata + Monogram 'I' -->
  <g transform="translate(46, 48)">
    <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#seal-fill-light)" stroke="#C2B7A6" stroke-width="1.25" />
    <rect x="6" y="6" width="88" height="88" rx="17" fill="none" stroke="#9A3115" stroke-opacity="0.24" stroke-width="1" />

    <!-- Subtle orbital calibration ring -->
    <circle cx="50" cy="50" r="33" fill="none" stroke="#DFD6C5" stroke-width="1" />

    <!-- PostgreSQL stacked cylinder strata -->
    <ellipse cx="50" cy="33" rx="21" ry="6" fill="none" stroke="#25486B" stroke-width="1.6" stroke-opacity="0.88" />
    <path d="M 29 45 C 29 49.5, 71 49.5, 71 45" fill="none" stroke="#8A8073" stroke-width="1.4" stroke-opacity="0.65" stroke-linecap="round" />
    <path d="M 29 57 C 29 61.5, 71 61.5, 71 57" fill="none" stroke="#8A8073" stroke-width="1.4" stroke-opacity="0.65" stroke-linecap="round" />
    <path d="M 29 33 V 67 C 29 71.5, 71 71.5, 71 67 V 33" fill="none" stroke="#B8AE9E" stroke-width="1.4" />

    <!-- Bold central sienna architectural 'I' monolith + carbon ink serif terminals -->
    <line x1="42" y1="41" x2="58" y2="41" stroke="#14110F" stroke-width="2.2" stroke-linecap="round" />
    <line x1="50" y1="41" x2="50" y2="66" stroke="#9A3115" stroke-width="3.2" stroke-linecap="round" />
    <line x1="42" y1="66" x2="58" y2="66" stroke="#14110F" stroke-width="2.2" stroke-linecap="round" />

    <!-- Forest emerald accent diamond -->
    <polygon points="73,67 77,71 73,75 69,71" fill="#18593B" />
  </g>

  <!-- Central Editorial Typography -->
  <g transform="translate(172, 48)">
    <text x="2" y="13"
          font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif"
          font-size="10.2" font-weight="600" letter-spacing="2.5" fill="#9A3115">
      POSTGRESQL  &#183;  IN THE TERMINAL
    </text>

    <text x="0" y="67"
          font-family="'New York', 'Iowan Old Style', 'Apple Garamond', Baskerville, Georgia, 'Times New Roman', serif"
          font-size="54" font-weight="500" letter-spacing="-0.8" fill="#14110F">
      Ignatius<tspan fill="#9A3115">.</tspan>
    </text>

    <rect x="2" y="83" width="308" height="1.5" rx="0.75" fill="url(#accent-rule-light)" />

    <text x="2" y="105"
          font-family="'New York', 'Iowan Old Style', Baskerville, Georgia, 'Times New Roman', serif"
          font-style="italic" font-size="16" letter-spacing="0.2" fill="#4B443C">
      A quiet instrument for PostgreSQL.
    </text>
  </g>

  <!-- Right-Side Studio Specification Matrix -->
  <g transform="translate(540, 48)">
    <line x1="-22" y1="2" x2="-22" y2="106" stroke="#CFC6B5" stroke-width="1" />

    <!-- Studio spec header aligned with left eyebrow -->
    <text x="1" y="13"
          font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="9.5" letter-spacing="1.4" fill="#4B443C">
      PG 14-18  &#183;  NO TELEMETRY
    </text>

    <!-- 2x2 Recessed Studio Specification Matrix (143x25 tiles, 8px column gap) -->
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="143" height="25" rx="6" fill="#FFFFFF" fill-opacity="0.78" stroke="#C5BBA9" stroke-width="1" />
      <circle cx="12" cy="12.5" r="2.8" fill="#18593B" />
      <text x="21" y="15.6"
            font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
            font-size="8.6" letter-spacing="0.45" fill="#1E1B18">
        LOCAL-FIRST ENGINE
      </text>

      <rect x="151" y="0" width="143" height="25" rx="6" fill="#FFFFFF" fill-opacity="0.78" stroke="#C5BBA9" stroke-width="1" />
      <circle cx="163" cy="12.5" r="2.8" fill="#9A3115" />
      <text x="172" y="15.6"
            font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
            font-size="8.6" letter-spacing="0.45" fill="#1E1B18">
        ADAPTIVE PALETTES
      </text>

      <rect x="0" y="31" width="143" height="25" rx="6" fill="#FFFFFF" fill-opacity="0.78" stroke="#C5BBA9" stroke-width="1" />
      <circle cx="12" cy="43.5" r="2.8" fill="#714304" />
      <text x="21" y="46.6"
            font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
            font-size="8.6" letter-spacing="0.45" fill="#1E1B18">
        56 CHORDED ACTIONS
      </text>

      <rect x="151" y="31" width="143" height="25" rx="6" fill="#FFFFFF" fill-opacity="0.78" stroke="#C5BBA9" stroke-width="1" />
      <circle cx="163" cy="43.5" r="2.8" fill="#144F63" />
      <text x="172" y="46.6"
            font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
            font-size="8.6" letter-spacing="0.45" fill="#1E1B18">
        SAFE TRANSACTIONS
      </text>
    </g>

    <!-- Aligned Keycap Rail (94px pills, 6px gap -> 294px total) -->
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="94" height="22" rx="5" fill="#FFFFFF" fill-opacity="0.82" stroke="#9A3115" stroke-opacity="0.52" stroke-width="1" />
      <text x="47" y="14.2" text-anchor="middle"
            font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
            font-size="9.2" fill="#9A3115">
        <tspan font-weight="600">Ctrl+R</tspan><tspan fill="#4B443C"> Run</tspan>
      </text>

      <rect x="100" y="0" width="94" height="22" rx="5" fill="#FFFFFF" fill-opacity="0.82" stroke="#B8AE9E" stroke-width="1" />
      <text x="147" y="14.2" text-anchor="middle"
            font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
            font-size="9.2" fill="#25486B">
        <tspan font-weight="600">Ctrl+K</tspan><tspan fill="#4B443C"> Chord</tspan>
      </text>

      <rect x="200" y="0" width="94" height="22" rx="5" fill="#FFFFFF" fill-opacity="0.82" stroke="#B8AE9E" stroke-width="1" />
      <text x="247" y="14.2" text-anchor="middle"
            font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
            font-size="9.2" fill="#144F63">
        <tspan font-weight="600">Ctrl+P</tspan><tspan fill="#4B443C"> Menu</tspan>
      </text>
    </g>
  </g>
</svg>
