<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 196" width="760" height="169" role="img" aria-labelledby="ignatius-dark-title ignatius-dark-desc">
  <title id="ignatius-dark-title">Ignatius PostgreSQL Workbench (Atelier Dark)</title>
  <desc id="ignatius-dark-desc">Editorial studio wordmark for Ignatius, the PostgreSQL client you can point at production.</desc>
  <defs>
    <linearGradient id="card-bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D1A17" />
      <stop offset="55%" stop-color="#151310" />
      <stop offset="100%" stop-color="#100E0C" />
    </linearGradient>
    <radialGradient id="amber-glow-dark" cx="13%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#E6825C" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#E6BD6A" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#141210" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sage-glow-dark" cx="90%" cy="24%" r="38%">
      <stop offset="0%" stop-color="#8EC5BC" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#141210" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="seal-fill-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28231E" />
      <stop offset="100%" stop-color="#181512" />
    </linearGradient>
    <linearGradient id="border-rim-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#584E44" stop-opacity="0.92" />
      <stop offset="50%" stop-color="#38312B" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#4A423A" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="accent-rule-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E6825C" />
      <stop offset="55%" stop-color="#E6BD6A" />
      <stop offset="100%" stop-color="#4A433C" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Atelier obsidian-espresso gallery plaque -->
  <rect x="4" y="4" width="872" height="188" rx="18" fill="url(#card-bg-dark)" />
  <rect x="4" y="4" width="872" height="188" rx="18" fill="url(#amber-glow-dark)" />
  <rect x="4" y="4" width="872" height="188" rx="18" fill="url(#sage-glow-dark)" />
  <rect x="4.5" y="4.5" width="871" height="187" rx="17.5" fill="none" stroke="url(#border-rim-dark)" stroke-width="1" />
  <line x1="28" y1="5.5" x2="852" y2="5.5" stroke="#FAF5EC" stroke-opacity="0.08" stroke-width="1" />

  <!-- Architectural crop marks -->
  <path d="M 24 20 H 33 M 24 20 V 29" fill="none" stroke="#5A5147" stroke-width="1" stroke-linecap="round" />
  <path d="M 856 176 H 847 M 856 176 V 167" fill="none" stroke="#5A5147" stroke-width="1" stroke-linecap="round" />

  <!-- Balanced Geometric Seal: Architectural Portal + PG Database Strata + Monogram 'I' -->
  <g transform="translate(46, 48)">
    <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#seal-fill-dark)" stroke="#4A433C" stroke-width="1.25" />
    <rect x="6" y="6" width="88" height="88" rx="17" fill="none" stroke="#E6825C" stroke-opacity="0.26" stroke-width="1" />

    <!-- Subtle orbital calibration ring -->
    <circle cx="50" cy="50" r="33" fill="none" stroke="#3D362F" stroke-width="1" />

    <!-- PostgreSQL stacked cylinder strata (top ellipse + two clean arcs) -->
    <ellipse cx="50" cy="33" rx="21" ry="6" fill="none" stroke="#8EC5BC" stroke-width="1.6" stroke-opacity="0.85" />
    <path d="M 29 45 C 29 49.5, 71 49.5, 71 45" fill="none" stroke="#ADA396" stroke-width="1.4" stroke-opacity="0.6" stroke-linecap="round" />
    <path d="M 29 57 C 29 61.5, 71 61.5, 71 57" fill="none" stroke="#ADA396" stroke-width="1.4" stroke-opacity="0.6" stroke-linecap="round" />
    <path d="M 29 33 V 67 C 29 71.5, 71 71.5, 71 67 V 33" fill="none" stroke="#564E46" stroke-width="1.4" />

    <!-- Bold central terracotta architectural 'I' monolith + warm ivory serif terminals -->
    <line x1="42" y1="41" x2="58" y2="41" stroke="#FAF5EC" stroke-width="2.2" stroke-linecap="round" />
    <line x1="50" y1="41" x2="50" y2="66" stroke="#E6825C" stroke-width="3.2" stroke-linecap="round" />
    <line x1="42" y1="66" x2="58" y2="66" stroke="#FAF5EC" stroke-width="2.2" stroke-linecap="round" />

    <!-- Live amber cursor diamond -->
    <polygon points="73,67 77,71 73,75 69,71" fill="#E6BD6A" />
  </g>

  <!-- Central Editorial Typography -->
  <g transform="translate(172, 48)">
    <text x="2" y="14"
          font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif"
          font-size="10.5" font-weight="600" letter-spacing="2.6" fill="#E6825C">
      POSTGRESQL TERMINAL WORKBENCH  &#183;  RUST
    </text>

    <text x="0" y="68"
          font-family="'New York', 'Iowan Old Style', 'Apple Garamond', Baskerville, Georgia, 'Times New Roman', serif"
          font-size="54" font-weight="500" letter-spacing="-0.8" fill="#FAF5EC">
      Ignatius<tspan fill="#E6825C">.</tspan>
    </text>

    <rect x="2" y="84" width="308" height="1.5" rx="0.75" fill="url(#accent-rule-dark)" />

    <text x="2" y="106"
          font-family="'New York', 'Iowan Old Style', Baskerville, Georgia, 'Times New Roman', serif"
          font-style="italic" font-size="16" letter-spacing="0.15" fill="#ADA396">
      The PostgreSQL client you can point at production.
    </text>
  </g>

  <!-- Right-Side Dieter Rams Specification Matrix -->
  <g transform="translate(578, 52)">
    <line x1="-22" y1="-2" x2="-22" y2="96" stroke="#36302A" stroke-width="1" />

    <!-- Safety posture badge -->
    <rect x="0" y="0" width="256" height="28" rx="7" fill="#211D19" stroke="#3F3831" stroke-width="1" />
    <circle cx="15" cy="14" r="3.5" fill="#84C59F" />
    <text x="26" y="17.5"
          font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="10" letter-spacing="0.25" fill="#F2ECE1">
      TLS VERIFY-FULL &#183; READ-ONLY FIRST
    </text>

    <!-- Compatibility spec -->
    <text x="2" y="52"
          font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="10.8" letter-spacing="0.5" fill="#ADA396">
      PG 14..18  &#183;  ZERO TELEMETRY
    </text>

    <!-- Keycap chips -->
    <g transform="translate(0, 66)">
      <rect x="0" y="0" width="66" height="24" rx="5" fill="#2A241F" stroke="#E6825C" stroke-opacity="0.55" stroke-width="1" />
      <text x="33" y="15.5" text-anchor="middle"
            font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
            font-size="10.5" font-weight="600" fill="#E6825C">
        Ctrl+R
      </text>

      <rect x="74" y="0" width="66" height="24" rx="5" fill="#2A241F" stroke="#534B42" stroke-width="1" />
      <text x="107" y="15.5" text-anchor="middle"
            font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
            font-size="10.5" fill="#D8BE9A">
        Ctrl+K
      </text>

      <rect x="148" y="0" width="108" height="24" rx="5" fill="#2A241F" stroke="#534B42" stroke-width="1" />
      <text x="202" y="15.5" text-anchor="middle"
            font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
            font-size="10" fill="#8EC5BC">
        ATELIER EDITION
      </text>
    </g>
  </g>
</svg>
