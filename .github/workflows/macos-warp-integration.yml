name: Native Warp source integration

on:
  push:
    branches: [codex/warp-integration-check]

permissions:
  actions: read
  contents: read

jobs:
  renderer:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      WARP_SOURCE_SHA: 0b2db6e0bf3fa3c19f4c1a94899eb67c634a6973
      CANDIDATE_RUN: '44721590021'
      CANDIDATE_SHA: 5e5712a25e75f08b02df7525b283d7a81ac355c9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the successful non-publishing candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT:$RUNNER_OS:$RUNNER_ARCH" = github-hosted:macOS:ARM64
          test "$(uname -m)" = arm64
          test "$GITHUB_EVENT_NAME:$GITHUB_REF" = push:refs/heads/codex/warp-integration-check
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          identity="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/attempts/1" \
            --jq '[.id, .run_attempt, .head_sha, .head_branch, .path, .event, .status, .conclusion] | join(":")')"
          test "$identity" = "$CANDIDATE_RUN:1:$CANDIDATE_SHA:main:.github/workflows/release.yml:workflow_dispatch:completed:success"
      - name: Download the verified candidate aggregate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.CANDIDATE_RUN }}
          name: release-candidate-aggregate-44721590021-1
          path: ${{ runner.temp }}/ignatius-warp-candidate
          digest-mismatch: error
      - name: Build pinned PostgreSQL 18.7 for the loopback TLS fixture
        shell: bash
        run: |
          set -euo pipefail
          openssl_prefix="$(brew --prefix openssl@3)"
          if [ ! -x "$openssl_prefix/bin/openssl" ]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install openssl@3
          fi
          test -x "$openssl_prefix/bin/openssl"
          build_root="$(mktemp -d "$RUNNER_TEMP/ignatius-warp-pg-build.XXXXXXXX")"
          install_root="$(mktemp -d "$RUNNER_TEMP/ignatius-warp-pg-bin.XXXXXXXX")"
          trap 'rm -rf -- "$build_root"' EXIT
          cd "$build_root"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 60 --retry 2 --output postgresql-18.7.tar.bz2 \
            https://ftp.postgresql.org/pub/source/v18.7/postgresql-18.7.tar.bz2
          printf '%s\n' '441dfae4280cae3e0425e5f876f80559fb0731c140f1aae22b3e5a54d0411bfd  postgresql-18.7.tar.bz2' \
            | shasum -a 256 -c -
          tar -xjf postgresql-18.7.tar.bz2
          cd postgresql-18.7
          CPPFLAGS="-I$openssl_prefix/include" LDFLAGS="-L$openssl_prefix/lib" CC=clang \
            ./configure --prefix="$install_root" --with-ssl=openssl --without-icu --without-readline > configure.log 2>&1 \
            || { tail -n 50 configure.log; exit 1; }
          make -s -j4 > build.log 2>&1 || { tail -n 50 build.log; exit 1; }
          make -s install > install.log 2>&1 || { tail -n 50 install.log; exit 1; }
          test "$("$install_root/bin/postgres" --version)" = 'postgres (PostgreSQL) 18.7'
          echo "IGNATIUS_WARP_PGBIN=$install_root/bin" >> "$GITHUB_ENV"
          echo "IGNATIUS_WARP_OPENSSL=$openssl_prefix/bin/openssl" >> "$GITHUB_ENV"
      - name: Stage the bound arm64 archive and synthetic fixture wrapper
        shell: bash
        run: python3 tests/support/macos/prepare_warp_source_fixture.py "$RUNNER_TEMP/ignatius-warp-candidate"
      - name: Check out pinned Warp source and configure the native build
        shell: bash
        run: |
          set -euo pipefail
          source_root="$(mktemp -d "$RUNNER_TEMP/warp-integration-source.XXXXXXXX")"
          git init --quiet "$source_root"
          git -C "$source_root" remote add origin https://github.com/warpdotdev/warp.git
          git -C "$source_root" fetch --depth=1 origin "$WARP_SOURCE_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git -C "$source_root" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source_root" rev-parse HEAD)" = "$WARP_SOURCE_SHA"
          git -C "$source_root" lfs pull
          test -z "$(git -C "$source_root" status --porcelain)"
          rustup toolchain install 1.92.0 --profile minimal
          if ! command -v protoc >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install protobuf
          fi
          protoc --version
          if ! xcrun --sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version
          df -h "$RUNNER_TEMP"
          echo "WARP_SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"
      - name: Build and run the native Warp Integration renderer case
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_DEV_INCREMENTAL: 'false'
          CARGO_BUILD_JOBS: '2'
          CARGO_TERM_COLOR: never
          WARPUI_USE_REAL_DISPLAY_IN_INTEGRATION_TESTS: '1'
        run: |
          set -euo pipefail
          python3 tests/support/macos/register_warp_source_fixture.py "$WARP_SOURCE_ROOT"
          cd "$WARP_SOURCE_ROOT"
          cargo +1.92.0 run --locked -p integration --bin integration -- test_ignatius_native_renderer_restore
      - name: Retain the native fixture receipts and frames
        if: always() && env.IGNATIUS_WARP_FIXTURE_ROOT != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ignatius-warp-open-source-renderer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.IGNATIUS_WARP_FIXTURE_ROOT }}/candidate.json
            ${{ env.IGNATIUS_WARP_FIXTURE_ROOT }}/state/active.json
            ${{ env.IGNATIUS_WARP_FIXTURE_ROOT }}/state/runtime.json
            ${{ env.IGNATIUS_WARP_FIXTURE_ROOT }}/capture/test_ignatius_native_renderer_restore/*/ignatius-active.png
            ${{ env.IGNATIUS_WARP_FIXTURE_ROOT }}/capture/test_ignatius_native_renderer_restore/*/ignatius-restored.png
          retention-days: 7
          if-no-files-found: ignore
