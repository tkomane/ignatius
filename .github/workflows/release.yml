name: Release candidate archives

# This workflow prepares target-specific, non-publishing candidate bundles.
# It never creates a GitHub Release, signs an artefact, or distributes one.
# Each matrix job emits a per-target record. A final non-publishing job revalidates
# and aggregates all three records before retaining multi-target evidence.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to package"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  archive:
    name: Archive ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            format: tar.gz
            binary: ignatius
            rustflags: "-D warnings"
          - runner: macos-latest
            target: aarch64-apple-darwin
            format: tar.gz
            binary: ignatius
            rustflags: "-D warnings"
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            format: zip
            binary: ignatius.exe
            rustflags: "-D warnings -C link-arg=/Brepro"

    steps:
      - name: Check out the requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the target binary
        env:
          IGNATIUS_BUILD_IDENTITY: ci/${{ github.run_id }}-${{ github.run_attempt }}
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package and verify the candidate
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          FORMAT: ${{ matrix.format }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail

          # RUNNER_TEMP is native on Windows; cygpath makes it usable by the
          # Git Bash shell used for the shared packaging and verification path.
          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            if ! command -v cygpath >/dev/null 2>&1; then
              echo "cygpath is required on Windows for the shared release path" >&2
              exit 1
            fi
            release_root="$(cygpath -u "$RUNNER_TEMP")/ignatius-release/$TARGET"
          else
            release_root="$RUNNER_TEMP/ignatius-release/$TARGET"
          fi
          bundle="$release_root/bundle"
          artefacts="$release_root/artefacts"
          record_dir="$release_root/record"
          evidence="$release_root/evidence"
          mkdir -p "$bundle" "$artefacts" "$record_dir"

          if command -v python3 >/dev/null 2>&1; then
            python_bin=python3
          elif command -v python >/dev/null 2>&1 && python --version 2>&1 | grep -Eq '^Python 3(\.|$)'; then
            python_bin=python
          else
            echo "a Python 3 interpreter is required for deterministic archive creation" >&2
            exit 1
          fi
          archive_script="$PWD/scripts/create-release-archive.py"
          test -f "$archive_script"

          # Read the product authority directly. `cargo pkgid` output is a
          # package-ID representation, not a stable version-only interface,
          # and its spelling differs across Cargo versions.
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "could not read the product version from Cargo.toml" >&2
            exit 1
          fi
          binary_path="target/$TARGET/release/$BINARY"
          if [[ ! -f "$binary_path" ]]; then
            echo "target build did not produce the expected binary: $binary_path" >&2
            exit 1
          fi
          if [[ -L "$binary_path" ]]; then
            echo "refusing a symlinked target binary: $binary_path" >&2
            exit 1
          fi
          cp "$binary_path" "$bundle/$BINARY"

          archive_stem="ignatius-${version}-${TARGET}"
          case "$FORMAT" in
            tar.gz)
              archive_name="$archive_stem.tar.gz"
              ;;
            zip)
              archive_name="$archive_stem.zip"
              ;;
            *)
              echo "unsupported workflow archive format: $FORMAT" >&2
              exit 1
              ;;
          esac
          "$python_bin" "$archive_script" \
            --format "$FORMAT" \
            --source-dir "$bundle" \
            --binary "$BINARY" \
            --output "$artefacts/$archive_name"
          test -s "$artefacts/$archive_name"

          size_bytes="$(wc -c < "$artefacts/$archive_name" | tr -d '[:space:]')"
          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          build_identity="ci/${run_key}"
          # Retries change technical build and evidence identity only. Keep
          # one release-note identity for each product version.
          notes_entry="release candidate ${version}"
          evidence_path="release-evidence/runs/${run_key}/${TARGET}/release-record.json"

          cargo --locked xtask release generate \
            --output "$record_dir/release-record.json" \
            --target "$TARGET" \
            --artefact-name "$archive_name" \
            --artefact-format "$FORMAT" \
            --artefact-size "$size_bytes" \
            --notes-entry "$notes_entry" \
            --evidence-path "$evidence_path" \
            --build-identity "$build_identity" \
            --artefact-path "$artefacts/$archive_name"

          cargo --locked xtask release manifest generate \
            --record "$record_dir/release-record.json" \
            --artefact-dir "$artefacts" \
            --output-dir "$evidence"

          cargo --locked xtask release manifest verify \
            --record "$record_dir/release-record.json" \
            --artefact-dir "$artefacts" \
            --manifest "$evidence/release-manifest.json" \
            --checksums "$evidence/SHA256SUMS"

          # A candidate archive is useful only when the workflow also proves
          # that the readiness gate still refuses it until the remaining
          # source, evidence and owner gates are satisfied.
          set +e
          readiness_output="$(cargo --locked xtask release check "$record_dir/release-record.json" 2>&1)"
          readiness_status=$?
          set -e
          printf '%s\n' "$readiness_output"
          if [[ "$readiness_status" -eq 0 ]]; then
            echo "candidate unexpectedly passed the readiness gate" >&2
            exit 1
          fi
          for expected_blocker in \
            "not in a publishable readiness state" \
            "requires complete evidence" \
            "without verified signature evidence" \
            "without verified provenance evidence"; do
            if [[ "$readiness_output" != *"$expected_blocker"* ]]; then
              echo "readiness gate did not report expected blocker: $expected_blocker" >&2
              exit 1
            fi
          done

          # Upload only the four files this candidate contract produces. Keep
          # the allowlist outside the upload root so the scope file itself is
          # not mistaken for release evidence.
          upload="$release_root/upload"
          scope="$release_root/upload-scope.json"
          mkdir -p "$upload/artefacts" "$upload/record" "$upload/evidence"
          cp "$artefacts/$archive_name" "$upload/artefacts/$archive_name"
          cp "$record_dir/release-record.json" "$upload/record/release-record.json"
          cp "$evidence/release-manifest.json" "$upload/evidence/release-manifest.json"
          cp "$evidence/SHA256SUMS" "$upload/evidence/SHA256SUMS"
          printf '{"schema_version":1,"files":["artefacts/%s","record/release-record.json","evidence/release-manifest.json","evidence/SHA256SUMS"]}\n' \
            "$archive_name" > "$scope"
          cargo --locked xtask release evidence-scope --root "$upload" --allowlist "$scope"

          echo "Prepared non-publishing candidate: $archive_name"
          echo "Record: $record_dir/release-record.json"
          echo "Evidence: $evidence"
          echo "Upload scope: $upload"

      - name: Store run-scoped candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/ignatius-release/${{ matrix.target }}/upload

  runtime:
    name: Runtime install and rollback ${{ matrix.target }}
    needs: archive
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Check out the requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download target candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/ignatius-runtime-inputs
          pattern: release-candidate-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: false

      - name: Exercise the extracted candidate and rollback path
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            if ! command -v cygpath >/dev/null 2>&1; then
              echo "cygpath is required on Windows for the shared runtime path" >&2
              exit 1
            fi
            runtime_inputs="$(cygpath -u "$RUNNER_TEMP")/ignatius-runtime-inputs"
            runtime_root="$(cygpath -u "$RUNNER_TEMP")/ignatius-runtime"
          else
            runtime_inputs="$RUNNER_TEMP/ignatius-runtime-inputs"
            runtime_root="$RUNNER_TEMP/ignatius-runtime"
          fi
          # A single exact artifact is extracted directly into the requested
          # path by download-artifact. The aggregate job downloads three
          # artifacts and therefore uses their named subdirectories below.
          bundle="$runtime_inputs"
          test -d "$bundle"

          if command -v python3 >/dev/null 2>&1; then
            python_bin=python3
          elif command -v python >/dev/null 2>&1 && python --version 2>&1 | grep -Eq '^Python 3(\.|$)'; then
            python_bin=python
          else
            echo "a Python 3 interpreter is required for runtime evidence" >&2
            exit 1
          fi
          mkdir -p "$runtime_root"
          "$python_bin" scripts/release-runtime-smoke.py \
            --bundle "$bundle" \
            --target "$TARGET" \
            --output "$runtime_root/runtime-evidence.json"

      - name: Store run-scoped runtime evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-runtime-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/ignatius-runtime/runtime-evidence.json

  aggregate:
    name: Aggregate candidate evidence
    needs: [archive, runtime]
    runs-on: ubuntu-latest

    steps:
      - name: Check out the requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.97.1"

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Download target candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/ignatius-release-inputs
          pattern: release-candidate-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: false

      - name: Download target runtime evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/ignatius-runtime-inputs
          pattern: release-runtime-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: false

      - name: Reverify and aggregate the candidate
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "could not read the product version from Cargo.toml" >&2
            exit 1
          fi
          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          inputs_root="$RUNNER_TEMP/ignatius-release-inputs"
          runtime_inputs_root="$RUNNER_TEMP/ignatius-runtime-inputs"
          release_root="$RUNNER_TEMP/ignatius-release/aggregate"
          artefacts="$release_root/artefacts"
          record_dir="$release_root/record"
          evidence="$release_root/evidence"
          runtime="$release_root/runtime"
          mkdir -p "$artefacts" "$record_dir" "$runtime"

          targets=(
            aarch64-apple-darwin
            x86_64-pc-windows-msvc
            x86_64-unknown-linux-gnu
          )
          shopt -s nullglob dotglob
          downloaded_entries=("$inputs_root"/*)
          shopt -u nullglob dotglob
          if [[ "${#downloaded_entries[@]}" -ne "${#targets[@]}" ]]; then
            echo "unexpected number of downloaded target bundles: ${#downloaded_entries[@]}" >&2
            exit 1
          fi
          for entry in "${downloaded_entries[@]}"; do
            if [[ ! -d "$entry" || -L "$entry" ]]; then
              echo "downloaded target bundle is not an ordinary directory: $entry" >&2
              exit 1
            fi
          done
          shopt -s nullglob dotglob
          runtime_entries=("$runtime_inputs_root"/*)
          shopt -u nullglob dotglob
          if [[ "${#runtime_entries[@]}" -ne "${#targets[@]}" ]]; then
            echo "unexpected number of downloaded runtime bundles: ${#runtime_entries[@]}" >&2
            exit 1
          fi
          for entry in "${runtime_entries[@]}"; do
            if [[ ! -d "$entry" || -L "$entry" ]]; then
              echo "downloaded runtime bundle is not an ordinary directory: $entry" >&2
              exit 1
            fi
          done
          aggregate_args=()
          archive_names=()
          for target in "${targets[@]}"; do
            case "$target" in
              aarch64-apple-darwin|x86_64-unknown-linux-gnu)
                archive_name="ignatius-${version}-${target}.tar.gz"
                ;;
              x86_64-pc-windows-msvc)
                archive_name="ignatius-${version}-${target}.zip"
                ;;
              *)
                echo "unsupported aggregate target: $target" >&2
                exit 1
                ;;
            esac
            bundle="$inputs_root/release-candidate-${target}-${run_key}"
            record="$bundle/record/release-record.json"
            input_scope="$release_root/input-scope-${target}.json"
            printf '{"schema_version":1,"files":["artefacts/%s","record/release-record.json","evidence/release-manifest.json","evidence/SHA256SUMS"]}\n' \
              "$archive_name" > "$input_scope"
            cargo --locked xtask release evidence-scope \
              --root "$bundle" \
              --allowlist "$input_scope"
            cargo --locked xtask release validate "$record"
            cargo --locked xtask release manifest verify \
              --record "$record" \
              --artefact-dir "$bundle/artefacts" \
              --manifest "$bundle/evidence/release-manifest.json" \
              --checksums "$bundle/evidence/SHA256SUMS"
            runtime_bundle="$runtime_inputs_root/release-runtime-${target}-${run_key}"
            runtime_evidence="$runtime_bundle/runtime-evidence.json"
            test -d "$runtime_bundle"
            test ! -L "$runtime_bundle" \
              && test -f "$runtime_evidence" \
              && test ! -L "$runtime_evidence"
            runtime_target="$(jq -r '.target // empty' "$runtime_evidence")"
            runtime_source="$(jq -r '.source_revision // empty' "$runtime_evidence")"
            runtime_build="$(jq -r '.build_identity // empty' "$runtime_evidence")"
            runtime_status="$(jq -r '.status // empty' "$runtime_evidence")"
            test "$runtime_target" = "$target"
            test "$runtime_source" = "$(jq -r '.records[0].source_revision' "$record")"
            test "$runtime_build" = "$(jq -r '.records[0].build_identity' "$record")"
            test "$runtime_status" = pass
            runtime_scope="$release_root/runtime-scope-${target}.json"
            printf '{"schema_version":1,"files":["runtime-evidence.json"]}\n' > "$runtime_scope"
            cargo --locked xtask release evidence-scope \
              --root "$runtime_bundle" \
              --allowlist "$runtime_scope"
            cp "$runtime_evidence" "$runtime/$target.json"
            test ! -e "$artefacts/$archive_name"
            cp "$bundle/artefacts/$archive_name" "$artefacts/$archive_name"
            aggregate_args+=(--input "$record")
            archive_names+=("$archive_name")
          done

          aggregate_record="$record_dir/release-record.json"
          aggregate_evidence_path="release-evidence/runs/${run_key}/aggregate/release-record.json"
          cargo --locked xtask release aggregate \
            --output "$aggregate_record" \
            --evidence-path "$aggregate_evidence_path" \
            "${aggregate_args[@]}"
          cargo --locked xtask release validate "$aggregate_record"
          cargo --locked xtask release manifest generate \
            --record "$aggregate_record" \
            --artefact-dir "$artefacts" \
            --output-dir "$evidence"
          cargo --locked xtask release manifest verify \
            --record "$aggregate_record" \
            --artefact-dir "$artefacts" \
            --manifest "$evidence/release-manifest.json" \
            --checksums "$evidence/SHA256SUMS"

          set +e
          readiness_output="$(cargo --locked xtask release check "$aggregate_record" 2>&1)"
          readiness_status=$?
          set -e
          printf '%s\n' "$readiness_output"
          if [[ "$readiness_status" -eq 0 ]]; then
            echo "aggregate unexpectedly passed the readiness gate" >&2
            exit 1
          fi
          for expected_blocker in \
            "not in a publishable readiness state" \
            "requires complete evidence" \
            "without verified signature evidence" \
            "without verified provenance evidence"; do
            if [[ "$readiness_output" != *"$expected_blocker"* ]]; then
              echo "aggregate readiness did not report expected blocker: $expected_blocker" >&2
              exit 1
            fi
          done

          upload="$release_root/upload"
          scope="$release_root/upload-scope.json"
          mkdir -p "$upload/artefacts" "$upload/record" "$upload/evidence" "$upload/runtime"
          for archive_name in "${archive_names[@]}"; do
            cp "$artefacts/$archive_name" "$upload/artefacts/$archive_name"
          done
          cp "$aggregate_record" "$upload/record/release-record.json"
          cp "$evidence/release-manifest.json" "$upload/evidence/release-manifest.json"
          cp "$evidence/SHA256SUMS" "$upload/evidence/SHA256SUMS"
          for target in "${targets[@]}"; do
            cp "$runtime/$target.json" "$upload/runtime/$target.json"
          done
          printf '{"schema_version":1,"files":["artefacts/%s","artefacts/%s","artefacts/%s","record/release-record.json","evidence/release-manifest.json","evidence/SHA256SUMS","runtime/%s.json","runtime/%s.json","runtime/%s.json"]}\n' \
            "${archive_names[0]}" "${archive_names[1]}" "${archive_names[2]}" \
            "${targets[0]}" "${targets[1]}" "${targets[2]}" > "$scope"
          cargo --locked xtask release evidence-scope --root "$upload" --allowlist "$scope"

          echo "Prepared non-publishing aggregate for ${#archive_names[@]} targets"
          echo "Record: $aggregate_record"
          echo "Evidence: $evidence"
          echo "Upload scope: $upload"

      - name: Store run-scoped aggregate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/ignatius-release/aggregate/upload

  reproducibility:
    name: Reproducibility ${{ matrix.target }} repeat ${{ matrix.repeat }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            format: tar.gz
            binary: ignatius
            rustflags: "-D warnings"
            repeat: one
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            format: tar.gz
            binary: ignatius
            rustflags: "-D warnings"
            repeat: two
          - runner: macos-latest
            target: aarch64-apple-darwin
            format: tar.gz
            binary: ignatius
            rustflags: "-D warnings"
            repeat: one
          - runner: macos-latest
            target: aarch64-apple-darwin
            format: tar.gz
            binary: ignatius
            rustflags: "-D warnings"
            repeat: two
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            format: zip
            binary: ignatius.exe
            rustflags: "-D warnings -C link-arg=/Brepro"
            repeat: one
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            format: zip
            binary: ignatius.exe
            rustflags: "-D warnings -C link-arg=/Brepro"
            repeat: two

    steps:
      - name: Check out the requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build a fixed-identity reproducibility candidate
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          FORMAT: ${{ matrix.format }}
          BINARY: ${{ matrix.binary }}
          REPEAT: ${{ matrix.repeat }}
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          set -euo pipefail
          source_revision="$(git rev-parse HEAD)"
          export IGNATIUS_BUILD_IDENTITY="ci/repro-${source_revision}"
          cargo build --locked --release --target "$TARGET"

          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            if ! command -v cygpath >/dev/null 2>&1; then
              echo "cygpath is required on Windows for reproducibility packaging" >&2
              exit 1
            fi
            repro_root="$(cygpath -u "$RUNNER_TEMP")/ignatius-repro/$TARGET/$REPEAT"
          else
            repro_root="$RUNNER_TEMP/ignatius-repro/$TARGET/$REPEAT"
          fi
          bundle="$repro_root/bundle"
          artefacts="$repro_root/artefacts"
          mkdir -p "$bundle" "$artefacts"
          binary_path="target/$TARGET/release/$BINARY"
          test -f "$binary_path" && test ! -L "$binary_path"
          cp "$binary_path" "$bundle/$BINARY"
          version="$(sed -n 's/^version = "\([^\"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          archive_stem="ignatius-${version}-${TARGET}"
          case "$FORMAT" in
            tar.gz) archive_name="$archive_stem.tar.gz" ;;
            zip) archive_name="$archive_stem.zip" ;;
            *) echo "unsupported reproducibility format: $FORMAT" >&2; exit 1 ;;
          esac
          if command -v python3 >/dev/null 2>&1; then
            python_bin=python3
          elif command -v python >/dev/null 2>&1 && python --version 2>&1 | grep -Eq '^Python 3(\.|$)'; then
            python_bin=python
          else
            echo "a Python 3 interpreter is required for reproducibility packaging" >&2
            exit 1
          fi
          "$python_bin" scripts/create-release-archive.py \
            --format "$FORMAT" \
            --source-dir "$bundle" \
            --binary "$BINARY" \
            --output "$artefacts/$archive_name"
          test -s "$artefacts/$archive_name"

      - name: Store reproducibility candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-repro-${{ matrix.target }}-${{ matrix.repeat }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/ignatius-repro/${{ matrix.target }}/${{ matrix.repeat }}/artefacts

  compare-reproducibility:
    name: Compare reproducibility candidates
    needs: reproducibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out the requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download reproducibility candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/ignatius-repro-inputs
          pattern: release-repro-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: false

      - name: Compare fixed-identity archive bytes
        shell: bash
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/ignatius-repro-inputs"
          evidence_root="$RUNNER_TEMP/ignatius-reproducibility"
          mkdir -p "$evidence_root"
          expected=6
          shopt -s nullglob dotglob
          entries=("$input_root"/*)
          shopt -u nullglob dotglob
          if [[ "${#entries[@]}" -ne "$expected" ]]; then
            echo "unexpected number of reproducibility bundles: ${#entries[@]}" >&2
            exit 1
          fi
          source_revision="$(git rev-parse HEAD)"
          version="$(sed -n 's/^version = "\([^\"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          targets=(
            aarch64-apple-darwin
            x86_64-pc-windows-msvc
            x86_64-unknown-linux-gnu
          )
          hashes=()
          for target in "${targets[@]}"; do
            case "$target" in
              x86_64-pc-windows-msvc) suffix=.zip ;;
              *) suffix=.tar.gz ;;
            esac
            archive_name="ignatius-${version}-${target}${suffix}"
            first="$input_root/release-repro-${target}-one-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/$archive_name"
            second="$input_root/release-repro-${target}-two-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/$archive_name"
            test -f "$first" && test ! -L "$first"
            test -f "$second" && test ! -L "$second"
            cmp -- "$first" "$second"
            digest="$(sha256sum "$first" | awk '{print $1}')"
            hashes+=("$target:$digest")
          done
          {
            printf '{\n  "schema_version": 1,\n  "status": "pass",\n  "evidence_level": "verified",\n  "source_revision": "%s",\n  "build_identity": "ci/repro-%s",\n  "targets": [' "$source_revision" "$source_revision"
            for index in "${!hashes[@]}"; do
              [[ "$index" -gt 0 ]] && printf ', '
              target="${hashes[$index]%%:*}"
              digest="${hashes[$index]#*:}"
              printf '{"target":"%s","checksum":"%s"}' "$target" "$digest"
            done
            printf '],\n  "scope": "two fixed-identity hosted builds per target; no publication action"\n}\n'
          } > "$evidence_root/reproducibility-evidence.json"

      - name: Store reproducibility comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-reproducibility-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/ignatius-reproducibility/reproducibility-evidence.json
