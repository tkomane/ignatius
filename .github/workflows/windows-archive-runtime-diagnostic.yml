name: Windows live archive diagnostic

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Select the live TLS check or a Windows Terminal archive diagnostic
        required: true
        default: postgres-runtime
        type: choice
        options:
          - postgres-runtime
          - terminal-renderer
          - terminal-renderer-arm64
      candidate_run:
        description: Completed non-publishing release run ID on main
        required: true
        type: string
      candidate_attempt:
        description: Successful run attempt that retained the aggregate
        required: true
        default: "1"
        type: string
      source_revision:
        description: Full source revision recorded in the candidate manifest
        required: true
        type: string
      window_cursor_calibration:
        description: Calibrate the displayed cursor on the owned Windows 11 ARM64 window
        default: false
        type: boolean
      powershell_workbench:
        description: Run a live read-only PostgreSQL verify-full query from the owned PowerShell 7 session
        default: false
        type: boolean
      workbench_performance:
        description: Time local workbench inputs in the native console for candidate ci/44681770913-1
        default: false
        type: boolean
      workbench_grid:
        description: Use the retained-row grid timings within the exact workbench performance route
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  runtime:
    name: Verify the retained Windows archive (${{ inputs.probe }})
    runs-on: ${{ inputs.probe == 'terminal-renderer-arm64' && 'windows-11-arm' || 'windows-latest' }}
    timeout-minutes: 15
    env:
      PROBE: ${{ inputs.probe }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
      SOURCE_REVISION: ${{ inputs.source_revision }}
      WINDOW_CURSOR_CALIBRATION: ${{ inputs.window_cursor_calibration }}
      POWERSHELL_WORKBENCH: ${{ inputs.powershell_workbench }}
      WORKBENCH_PERFORMANCE: ${{ inputs.workbench_performance }}
      WORKBENCH_GRID: ${{ inputs.workbench_grid }}
    steps:
      - name: Resolve the completed release run and attempt
        id: candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:PROBE -cnotin @('postgres-runtime', 'terminal-renderer', 'terminal-renderer-arm64') -or
              $env:CANDIDATE_RUN -cnotmatch '\A[1-9][0-9]{0,18}\z' -or
              $env:CANDIDATE_ATTEMPT -cnotmatch '\A[1-9][0-9]{0,3}\z' -or
              $env:SOURCE_REVISION -cnotmatch '\A[0-9a-f]{40}\z') {
            throw "Expected a numeric run and attempt with a full lowercase source revision"
          }
          if ($env:WINDOW_CURSOR_CALIBRATION -ceq 'true' -and $env:PROBE -cne 'terminal-renderer-arm64') {
            throw 'Window cursor calibration requires terminal-renderer-arm64.'
          }
          if ($env:POWERSHELL_WORKBENCH -ceq 'true' -and
              ($env:PROBE -cne 'terminal-renderer-arm64' -or $env:WINDOW_CURSOR_CALIBRATION -cne 'true')) {
            throw 'The live PowerShell workbench requires terminal-renderer-arm64 and window cursor calibration.'
          }
          if ($env:WORKBENCH_PERFORMANCE -ceq 'true' -and
              ($env:POWERSHELL_WORKBENCH -cne 'true' -or $env:CANDIDATE_RUN -cne '44681770913' -or
              $env:CANDIDATE_ATTEMPT -cne '1' -or $env:SOURCE_REVISION -cne '61425c34097020ecec3ffead0bec7d4251680814')) {
            throw 'The workbench timings require the exact retained candidate and native PowerShell workbench.'
          }
          if ($env:WORKBENCH_GRID -ceq 'true' -and $env:WORKBENCH_PERFORMANCE -cne 'true') {
            throw 'Retained-grid timing requires the exact workbench performance mode.'
          }
          $runJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN/attempts/$env:CANDIDATE_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve the candidate run attempt" }
          $run = $runJson | ConvertFrom-Json
          if ($run.repository.full_name -cne $env:GITHUB_REPOSITORY -or
              $run.path -cne '.github/workflows/release.yml' -or
              $run.head_branch -cne 'main' -or
              $run.event -cne 'workflow_dispatch' -or
              $run.status -cne 'completed' -or
              $run.conclusion -cne 'success' -or
              $run.id.ToString() -cne $env:CANDIDATE_RUN -or
              $run.run_attempt.ToString() -cne $env:CANDIDATE_ATTEMPT) {
            throw "Expected a successful non-publishing release attempt in this repository"
          }
          "aggregate=release-candidate-aggregate-$env:CANDIDATE_RUN-$env:CANDIDATE_ATTEMPT" >> $env:GITHUB_OUTPUT

      - name: Check out the diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.1"
      - name: Download the exact retained aggregate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.CANDIDATE_RUN }}
          name: ${{ steps.candidate.outputs.aggregate }}
          path: ${{ runner.temp }}/ignatius-windows-candidate
          digest-mismatch: error

      - name: Verify candidate bytes, source and build identity
        shell: pwsh
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'ignatius-windows-candidate'
          $manifestPath = Join-Path $candidate 'evidence/release-manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $expectedBuild = "ci/$env:CANDIDATE_RUN-$env:CANDIDATE_ATTEMPT"
          if ($manifest.source_revision -cne $env:SOURCE_REVISION -or
              $manifest.build_identity -cne $expectedBuild) {
            throw "The retained manifest has a different source revision or build identity"
          }
          cargo --locked xtask release manifest verify `
            --record (Join-Path $candidate 'record/release-record.json') `
            --artefact-dir (Join-Path $candidate 'artefacts') `
            --manifest $manifestPath `
            --checksums (Join-Path $candidate 'evidence/SHA256SUMS')
          if ($LASTEXITCODE -ne 0) { throw "Candidate bytes did not match the retained manifest" }
          $windowsArchive = @($manifest.artefacts | Where-Object { $_.target -ceq 'x86_64-pc-windows-msvc' })
          if ($windowsArchive.Count -ne 1 -or $windowsArchive[0].format -cne 'zip') {
            throw "Expected one verified Windows ZIP in the manifest"
          }
          $archivePath = Join-Path $candidate "artefacts/$($windowsArchive[0].name)"
          $archive = [IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            if ($archive.Entries.Count -ne 1 -or $archive.Entries[0].FullName -cne 'ignatius.exe') {
              throw "Expected the verified Windows ZIP to contain only ignatius.exe"
            }
          } finally {
            $archive.Dispose()
          }
          $unpacked = Join-Path $env:RUNNER_TEMP 'ignatius-windows-unpacked'
          Expand-Archive -LiteralPath $archivePath -DestinationPath $unpacked
          $binary = Join-Path $unpacked 'ignatius.exe'
          if ($env:PROBE -cne 'postgres-runtime') {
            $runtimePath = Join-Path $candidate 'runtime/x86_64-pc-windows-msvc.json'
            $runtime = Get-Content -LiteralPath $runtimePath -Raw | ConvertFrom-Json
            $binaryHash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($runtime.schema_version -ne 1 -or $runtime.status -cne 'pass' -or
                $runtime.target -cne 'x86_64-pc-windows-msvc' -or
                $runtime.source_revision -cne $env:SOURCE_REVISION -or
                $runtime.build_identity -cne $expectedBuild -or
                $runtime.archive_name -cne $windowsArchive[0].name -or
                $runtime.binary_sha256 -cne $binaryHash) {
              throw 'Windows executable does not match the retained runtime receipt.'
            }
            "IGNATIUS_ARCHIVED_SHA256=$binaryHash" >> $env:GITHUB_ENV
          }
          "IGNATIUS_ARCHIVED_EXE=$binary" >> $env:GITHUB_ENV
          "IGNATIUS_EXPECTED_BUILD=$expectedBuild" >> $env:GITHUB_ENV

      - name: Run native Windows archive TLS and privacy checks
        if: inputs.probe == 'postgres-runtime'
        shell: pwsh
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP 'ignatius-windows-archive-runtime.json'
          try {
            ./scripts/release-runtime-windows.ps1 -BinaryPath $env:IGNATIUS_ARCHIVED_EXE `
              -ExpectedSourceRevision $env:SOURCE_REVISION -ExpectedBuildIdentity $env:IGNATIUS_EXPECTED_BUILD `
              -EvidencePath $receipt
          } finally {
            if (Test-Path -LiteralPath $receipt -PathType Leaf) { Get-Content -LiteralPath $receipt }
          }

      - name: Run the archived client in owned portable Windows Terminal
        if: inputs.probe == 'terminal-renderer' || inputs.probe == 'terminal-renderer-arm64'
        id: renderer
        shell: pwsh
        run: |
          $parameters = @{
            ArchivedClient = $env:IGNATIUS_ARCHIVED_EXE
            ExpectedClientSha256 = $env:IGNATIUS_ARCHIVED_SHA256
            CandidateSource = $env:SOURCE_REVISION
            CandidateBuild = $env:IGNATIUS_EXPECTED_BUILD
          }
          if ($env:POWERSHELL_WORKBENCH -ceq 'true') {
            ./tests/support/windows_conpty/Run-WorkbenchFixture.ps1 @parameters `
              -WorkbenchPerformance:($env:WORKBENCH_PERFORMANCE -ceq 'true') `
              -WorkbenchGrid:($env:WORKBENCH_GRID -ceq 'true')
          } else {
            ./tests/support/windows_conpty/Run-RendererCalibration.ps1 @parameters `
              -WindowCursorCalibration:($env:WINDOW_CURSOR_CALIBRATION -ceq 'true')
          }

      - name: Retain the owned archive rendering and restoration observations
        if: ${{ always() && steps.renderer.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-terminal-archive-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ignatius-renderer-${{ github.run_id }}-${{ github.run_attempt }}/work/build.json
            ${{ runner.temp }}/ignatius-renderer-${{ github.run_id }}-${{ github.run_attempt }}/work/renderer-report.json
            ${{ runner.temp }}/ignatius-renderer-${{ github.run_id }}-${{ github.run_attempt }}/work/workbench-performance.json
            ${{ runner.temp }}/ignatius-renderer-${{ github.run_id }}-${{ github.run_attempt }}/work/workbench-grid-performance.json
            ${{ runner.temp }}/ignatius-renderer-${{ github.run_id }}-${{ github.run_attempt }}/work/workbench-filtered-grid.bmp
            ${{ runner.temp }}/ignatius-renderer-${{ github.run_id }}-${{ github.run_attempt }}/work/baseline.bmp
            ${{ runner.temp }}/ignatius-renderer-${{ github.run_id }}-${{ github.run_attempt }}/work/ignatius-active.bmp
            ${{ runner.temp }}/ignatius-renderer-${{ github.run_id }}-${{ github.run_attempt }}/work/ignatius-restored.bmp
            ${{ runner.temp }}/ignatius-renderer-${{ github.run_id }}-${{ github.run_attempt }}/work/workbench-failure.txt
            ${{ runner.temp }}/ignatius-renderer-${{ github.run_id }}-${{ github.run_attempt }}/work/cursor-phase-0.bmp
            ${{ runner.temp }}/ignatius-renderer-${{ github.run_id }}-${{ github.run_attempt }}/work/cursor-phase-1.bmp
            ${{ runner.temp }}/ignatius-renderer-${{ github.run_id }}-${{ github.run_attempt }}/work/cursor-phase-2.bmp
            ${{ runner.temp }}/ignatius-renderer-${{ github.run_id }}-${{ github.run_attempt }}/work/cursor-phase-3.bmp
            ${{ runner.temp }}/ignatius-renderer-${{ github.run_id }}-${{ github.run_attempt }}/work/cursor-phase-4.bmp
