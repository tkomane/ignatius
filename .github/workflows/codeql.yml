name: CodeQL

# Advanced setup replaces GitHub's default setup so the configuration file below
# can keep test sources out of the analysis. Rust has no inline alert
# suppression yet (github/codeql#21637), and this project's tests deliberately
# format password-like values to prove they never reach output, which the
# cleartext-logging query otherwise reports as high-severity findings.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Analysis inputs can change without a source commit. Recheck weekly at
    # 05:23 Africa/Johannesburg, after the fixture-drift run.
    - cron: "23 3 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: python
          - language: actions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rust is analysed without a build. The interpreted languages reject an
      # explicit build mode, so they use their own init step.
      - name: Initialize CodeQL for Rust
        if: matrix.language == 'rust'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - name: Initialize CodeQL
        if: matrix.language != 'rust'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
