# One update system, not two. Renovate is deliberately not configured.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    rebase-strategy: auto
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Grouped so a routine patch sweep is one review, not fifteen.
      patch-and-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    rebase-strategy: auto
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      # Routine compatible updates should produce one coherent CI review.
      # Major action upgrades remain separate so their runtime and input
      # changes cannot hide inside a patch sweep.
      patch-and-minor:
        update-types: ["minor", "patch"]
