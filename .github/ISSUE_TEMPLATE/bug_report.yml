name: Bug report
description: Something behaves incorrectly. Security reports go through the private route instead.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use
        [private vulnerability reporting](https://github.com/tkomane/ignatius/security/advisories/new)
        as described in [SECURITY.md](https://github.com/tkomane/ignatius/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command or keystrokes, and the smallest statement that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Build identity
      description: "Paste the output of `ignatius version --verbose`."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Platform and terminal
      description: Operating system and version, terminal and version, and the PostgreSQL server version.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Relevant output. Remove credentials, real data, host names and connection strings before pasting.
  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: This report contains no real credentials and no real data.
          required: true
        - label: This is not a security vulnerability, which is reported privately instead.
          required: true
