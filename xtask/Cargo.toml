[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false
description = "Development and release tasks for Ignatius"

[dependencies]
# The release gate reads source-controlled JSON contracts portably on macOS,
# Windows and Linux. It performs no network access and keeps the other
# development tasks independent of the application crate.
serde = "1.0.229"
serde_json = { version = "1.0.145", features = ["arbitrary_precision"] }
sha2 = "0.11.0"
