# Host-based authentication for the TLS development database.
#
# Deliberately strict, so the tests exercise the real paths:
#   - cert_user authenticates with a client certificate and nothing else
#   - everyone else needs SCRAM, over TLS
local   all             all                                     trust
hostssl all             cert_user       0.0.0.0/0               cert clientcert=verify-full
hostssl all             cert_user       ::0/0                   cert clientcert=verify-full
hostssl all             all             0.0.0.0/0               scram-sha-256
hostssl all             all             ::0/0                   scram-sha-256
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::0/0                   scram-sha-256
