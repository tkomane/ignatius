# Disposable PostgreSQL for local development and integration tests.
#
# Credentials live in dev.env and are synthetic: they exist only inside this
# throwaway container. Start it with `cargo xtask db up`, which waits for the
# server to be ready and prints the connection URI.
name: ignatius-dev

services:
  postgres:
    image: postgres:${IGNATIUS_PG_VERSION:-18.4}-alpine
    env_file:
      - ./dev.env
    environment:
      # PostgreSQL 14 and later default to SCRAM-SHA-256; state it so the
      # integration tests are provably exercising SCRAM.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "55432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A second server that actually speaks TLS, so the transport claims this
  # product makes can be tested rather than asserted. Its certificates are
  # generated on demand by tls/generate.sh and are never committed.
  postgres-tls:
    image: postgres:${IGNATIUS_PG_VERSION:-18.4}-alpine
    env_file:
      - ./dev.env
    environment:
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "55433:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./tls/generated:/certs-source:ro
      - ./tls/pg_hba.conf:/pg_hba.conf:ro
    # The container starts as root, so the certificates are copied and given the
    # ownership PostgreSQL insists on before the server drops privileges.
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /certs
        cp /certs-source/ca.crt /certs-source/server.crt /certs-source/server.key /pg_hba.conf /certs/
        chown postgres:postgres /certs/*
        chmod 600 /certs/server.key
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/certs/server.crt \
          -c ssl_key_file=/certs/server.key \
          -c ssl_ca_file=/certs/ca.crt \
          -c hba_file=/certs/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
