# Dependency policy. Run with `cargo deny check`.

[advisories]
yanked = "deny"
ignore = [
    # chrono was marked unmaintained upstream (no vulnerability; pulled both directly and via tokio-postgres with-chrono-0_4).
    # Review by 2027-03-01 alongside a future migration to time/jiff once postgres-types supports it cleanly.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained advisory with no safe upgrade path while postgres-types depends on chrono" },
]

[licenses]
# Permissive licences only. Anything copyleft needs a deliberate decision, not a
# silent addition, because this ships as a single binary.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
# The list above is a policy, not an inventory. A licence nobody happens to use
# today is still a decision worth recording, so an unused entry is not a warning.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
